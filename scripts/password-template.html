<body class="unlock-page">
  <header><div class="brand">G2<span>ROBOTICS LAB</span></div><div class="header-actions"><span class="edition">POLYU TASLAB · FIELD GUIDE</span><nav class="language-switch" aria-label="Interface language" data-i18n-ignore><button type="button" data-language="en" lang="en" aria-pressed="true">English</button><button type="button" data-language="zh-CN" lang="zh-CN" aria-pressed="false">中文</button></nav></div></header>
  <main>
    <section>
      <p class="eyebrow">LABORATORY FIELD GUIDE</p>
      <h1>Go2 EDU<span>.</span></h1>
      <h2>Lab Field Guide</h2>
      <p class="description">Enter the access password to open the robot manual.</p>
      <form id="unlock-form">
        <label for="access-password">Access password</label>
        <div class="password-box"><input id="access-password" type="password" name="password" autocomplete="current-password" required autofocus><button type="button" class="reveal" aria-pressed="false">Show</button></div>
        <button type="submit" class="submit"><span>Unlock manual</span><span aria-hidden="true">↗</span></button>
        <p class="error" id="unlock-error" role="alert" aria-live="polite"></p>
      </form>
    </section>
    <figure class="art"><img src="assets/unitree-go2-product.png" alt="Official Unitree Go2 product image"><figcaption>Official Unitree product image · Not a lab photograph</figcaption></figure>
  </main>
  <footer><span>PolyU TASLAB · Unitree Go2 EDU</span><span>LAB FIELD GUIDE</span></footer>
  <script id="manual-translations" type="application/json">[["Go2 EDU | Lab Field Guide","Go2 EDU｜实验室使用手册"],["Lab Field Guide","实验室使用手册"],["Enter the access password to open the robot manual.","请输入访问密码，查看机器狗操作手册。"],["Access password","访问密码"],["Show","显示"],["Hide","隐藏"],["Unlock manual","解锁手册"],["Unlocking…","正在解锁…"],["Incorrect password. Please try again.","密码不正确，请重新输入。"],["Unable to unlock. Refresh the page and try again.","解锁失败，请刷新页面后重试。"],["Official Unitree Go2 product image","Unitree Go2 官方产品图"],["Official Unitree product image · Not a lab photograph","Unitree 官方产品图 · 非实验室实拍"],["Interface language","界面语言"]]</script>
  <script src="i18n.js?v=20261027"></script>
  <script>
    const staticryptInitiator = /*[|js_staticrypt|]*/0;
    const staticryptConfig = /*[|staticrypt_config|]*/0;
    const staticrypt = staticryptInitiator.init(staticryptConfig, {
      rememberExpirationKey: 'go2_manual_expiration',
      rememberPassphraseKey: 'go2_manual_passphrase',
      replaceHtmlCallback: null,
      clearLocalStorageCallback: null,
    });
    const form = document.getElementById('unlock-form');
    const password = document.getElementById('access-password');
    const error = document.getElementById('unlock-error');
    const submit = form.querySelector('.submit');
    const reveal = form.querySelector('.reveal');
    reveal.addEventListener('click', () => {
      const visible = password.type === 'password';
      password.type = visible ? 'text' : 'password';
      reveal.textContent = window.ManualI18n.t(visible ? 'Hide' : 'Show');
      reveal.setAttribute('aria-pressed', String(visible));
    });
    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      error.textContent = '';
      submit.disabled = true;
      submit.firstElementChild.textContent = window.ManualI18n.t('Unlocking…');
      try {
        const result = await staticrypt.handleDecryptionOfPage(password.value, false);
        if (result.isSuccessful) return;
        error.textContent = window.ManualI18n.t('Incorrect password. Please try again.');
        password.select();
      } catch {
        error.textContent = window.ManualI18n.t('Unable to unlock. Refresh the page and try again.');
      }
      submit.disabled = false;
      submit.firstElementChild.textContent = window.ManualI18n.t('Unlock manual');
    });
  </script>
</body>
